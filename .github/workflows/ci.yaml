name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: canonical/hpc-team/.github/workflows/charmed-hpc-ci.yaml@main
    with:
      run-test: false
      just-version: 1.58.0
      setup-commands: &setup_cmds |
        sudo snap install astral-uv --classic --channel latest/stable
        sudo snap install charmcraft --classic --channel latest/stable

  unit-test:
    name: Unit tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: canonical/hpc-team/.github/actions/setup-just@main
        with:
          just-version: 1.58.0
      - run: *setup_cmds
      - run: just unit

  integration-test:
    name: Integration tests (LXD)
    needs: [ci, unit-test]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: canonical/hpc-team/.github/actions/setup-just@main
        with:
          just-version: 1.58.0
      - run: *setup_cmds
      - uses: charmed-kubernetes/actions-operator@main
        with:
          provider: lxd
          lxd-channel: 5.21/stable
          juju-channel: 3.6/stable
      - name: Run tests
        run: just integration
